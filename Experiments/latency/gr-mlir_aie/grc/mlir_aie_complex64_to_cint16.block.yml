id: mlir_aie_complex64_to_cint16
label: complex64_to_cint16
category: '[mlir_aie]'

templates:
  imports: from gnuradio import mlir_aie
  make: mlir_aie.complex64_to_cint16(${safe})

documentation: |-
  Converts complex float samples to packed XDNA cint16 samples. Real occupies
  bits 15:0 and imaginary occupies bits 31:16. Unsafe mode assumes all inputs
  are in range and truncates toward zero. Safe mode rounds and saturates.

parameters:
- id: safe
  label: Safe conversion
  dtype: bool
  default: 'False'

inputs:
-   label: in
    domain: stream
    dtype: complex

outputs:
-   label: out
    domain: stream
    dtype: int

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
