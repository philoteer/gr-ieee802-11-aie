id: mlir_aie_cint32_to_complex64
label: cint32_to_complex64
category: '[mlir_aie]'

templates:
  imports: from gnuradio import mlir_aie
  make: mlir_aie.cint32_to_complex64(${integer_bits}, ${fractional_bits})

documentation: |-
  Converts packed XDNA cint32 samples to complex float samples. Real occupies
  bits 31:0 and imaginary bits 63:32. The integer and fractional bits exclude
  the sign bit and must sum to 31.

parameters:
- id: integer_bits
  label: Integer bits
  dtype: int
  default: 15

- id: fractional_bits
  label: Fractional bits
  dtype: int
  default: 16

inputs:
-   label: in
    domain: stream
    dtype: s64

outputs:
-   label: out
    domain: stream
    dtype: complex

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
