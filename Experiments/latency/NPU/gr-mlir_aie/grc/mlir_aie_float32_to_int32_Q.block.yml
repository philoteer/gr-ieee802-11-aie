id: mlir_aie_float32_to_int32_Q
label: float32_to_int32_Q
category: '[mlir_aie]'

templates:
  imports: from gnuradio import mlir_aie
  make: mlir_aie.float32_to_int32_Q(${integer_bits}, ${fractional_bits}, ${safe})

documentation: |-
  Converts float samples to signed 32-bit fixed-point. The integer and
  fractional bits exclude the sign bit and must sum to 31. Unsafe mode assumes
  in-range input and truncates; safe mode rounds and saturates.

parameters:
- id: integer_bits
  label: Integer bits
  dtype: int
  default: 15

- id: fractional_bits
  label: Fractional bits
  dtype: int
  default: 16

- id: safe
  label: Safe conversion
  dtype: bool
  default: 'False'

inputs:
-   label: in
    domain: stream
    dtype: float

outputs:
-   label: out
    domain: stream
    dtype: int

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
