id: mlir_aie_complex64_to_cint32
label: complex64_to_cint32
category: '[mlir_aie]'

templates:
  imports: from gnuradio import mlir_aie
  make: mlir_aie.complex64_to_cint32(${integer_bits}, ${fractional_bits}, ${safe})

documentation: |-
  Converts complex float samples to packed cint32. Real occupies bits 31:0 and
  imaginary occupies bits 63:32. The integer and fractional bits exclude the
  sign bit and must sum to 31. Unsafe mode truncates in-range input; safe mode
  rounds and saturates.

parameters:
- id: integer_bits
  label: Integer bits
  dtype: int
  default: 15

- id: fractional_bits
  label: Fractional bits
  dtype: int
  default: 16

- id: safe
  label: Safe conversion
  dtype: bool
  default: 'False'

#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)
inputs:
-   label: in
    domain: stream
    dtype: complex

outputs:
-   label: out
    domain: stream
    dtype: s64

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
