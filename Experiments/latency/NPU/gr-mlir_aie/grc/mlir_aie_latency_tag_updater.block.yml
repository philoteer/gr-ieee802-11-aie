id: mlir_aie_latency_tag_updater
label: Latency Tag Updater
category: '[mlir_aie]'

templates:
  imports: from gnuradio import mlir_aie
  make: mlir_aie.latency_tag_updater(${name}, ${type.size} * ${vlen})

parameters:
- id: name
  label: Measurement Name
  dtype: string
  default: measurement
- id: type
  label: Sample Type
  dtype: enum
  default: complex
  options: [complex, float, int, short, byte]
  option_labels: [Complex Float32, Float32, Int32, Int16, Byte]
  option_attributes:
    size: [8, 4, 4, 2, 1]
- id: vlen
  label: Vector Length
  dtype: int
  default: 1

inputs:
- domain: stream
  dtype: ${type}
  vlen: ${vlen}

outputs:
- domain: stream
  dtype: ${type}
  vlen: ${vlen}

asserts:
- ${len(name) > 0}
- ${vlen > 0}

documentation: |-
  Passes samples through and appends a named CLOCK_MONOTONIC timestamp to
  frame_start/frame_end dictionary tags generated by SigMF Tag Injector.
  The original timestamp_ns and all other fields are preserved. New timestamps
  are uint64 nanoseconds stored in the nested timestamps_ns dictionary under
  Measurement Name. Use a unique name for each measurement point. Existing
  named entries, including one with the same name, are retained unchanged.
  One timestamp is taken at work() entry and shared by events in that callback.
  Subtract timestamp_ns from timestamps_ns[name] to measure latency from the
  injector, or subtract two named timestamps to measure between updaters.
  Scheduler batching and buffering contribute to these measurements.
  Nonmatching tags and tags with malformed timestamp fields pass unchanged.
  Offsets and tag source IDs are preserved. No duplicate event tags are added.

file_format: 1
