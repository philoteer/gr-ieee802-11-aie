id: mlir_aie_cint16_to_complex64
label: cint16_to_complex64
category: '[mlir_aie]'

templates:
  imports: from gnuradio import mlir_aie
  make: mlir_aie.cint16_to_complex64()

documentation: |-
  Converts packed XDNA cint16 samples to complex float samples. Signed Q1.15
  real occupies bits 15:0 and signed Q1.15 imaginary occupies bits 31:16.

inputs:
-   label: in
    domain: stream
    dtype: int

outputs:
-   label: out
    domain: stream
    dtype: complex

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
