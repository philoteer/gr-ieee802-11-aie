id: mlir_aie_mlir_aie_python_tagged_int32_to_int64
label: mlir_aie_python_tagged_int32_to_int64
category: '[mlir_aie]'

templates:
  imports: from gnuradio import mlir_aie
  make: mlir_aie.mlir_aie_python_tagged_int32_to_int64(${path_xclbin}, ${path_insts_bin}, ${kernel_name}, ${VECTOR_SIZE}, ${N_TILES})

parameters:
- id: path_xclbin
  label: path_xclbin
  dtype: file_open
  default: 'aie-kernel-src/build/final.xclbin'

- id: path_insts_bin
  label: path_insts_bin
  dtype: file_open
  default: 'aie-kernel-src/build/insts.bin'

- id: kernel_name
  label: kernel_name
  dtype: string
  default: 'MLIR_AIE'

- id: VECTOR_SIZE
  label: VECTOR_SIZE
  dtype: int
  default: 4096

- id: N_TILES
  label: Number of Tiles
  dtype: int
  default: 4

inputs:
- label: in
  domain: stream
  dtype: int

outputs:
- label: out
  domain: stream
  dtype: s64

file_format: 1
