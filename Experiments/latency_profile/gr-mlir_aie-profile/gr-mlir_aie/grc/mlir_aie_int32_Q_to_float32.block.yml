id: mlir_aie_int32_Q_to_float32
label: int32_Q_to_float32
category: '[mlir_aie]'

templates:
  imports: from gnuradio import mlir_aie
  make: mlir_aie.int32_Q_to_float32(${integer_bits}, ${fractional_bits})

documentation: |-
  Converts signed 32-bit fixed-point samples to float. The integer and
  fractional bits exclude the sign bit and must sum to 31.

parameters:
- id: integer_bits
  label: Integer bits
  dtype: int
  default: 15

- id: fractional_bits
  label: Fractional bits
  dtype: int
  default: 16

inputs:
-   label: in
    domain: stream
    dtype: int

outputs:
-   label: out
    domain: stream
    dtype: float

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
