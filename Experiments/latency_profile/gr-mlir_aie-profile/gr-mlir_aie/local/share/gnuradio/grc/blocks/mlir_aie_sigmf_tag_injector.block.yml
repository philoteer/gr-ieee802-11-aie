id: mlir_aie_sigmf_tag_injector
label: SigMF Tag Injector
category: '[mlir_aie]'

templates:
  imports: from gnuradio import mlir_aie
  make: mlir_aie.sigmf_tag_injector(${metadata_file}, ${type.size}, ${tag_key}, ${start_sample})

parameters:
- id: metadata_file
  label: SigMF Metadata File
  dtype: file_open
- id: type
  label: Sample Type
  dtype: enum
  default: complex
  options: [complex, float, int, short, byte]
  option_labels: [Complex Float32, Float32, Int32 (packed ci16), Int16, Byte]
  option_attributes:
    size: [8, 4, 4, 2, 1]
- id: tag_key
  label: Frequency Tag Key
  dtype: string
  default: rx_freq
- id: start_sample
  label: Starting Sample Offset
  dtype: int
  default: 0

inputs:
- domain: stream
  dtype: ${type}

outputs:
- domain: stream
  dtype: ${type}

asserts:
- ${start_sample >= 0}

documentation: |-
  Passes samples and existing tags through unchanged, adding frequency tags
  from captures/core:frequency at captures/core:sample_start. Values are PMT
  doubles in Hz. Emits the first known frequency, then only frequency changes.
  One stream item must represent one complete SigMF sample, including I and Q.
  For ci16_le files, use an Int32 File Source and Int32 (packed ci16), or place
  this block after cint16_to_complex64 and select Complex Float32.
  Set Starting Sample Offset to the File Source's initial offset (in samples).
  The active frequency at that offset is tagged at output sample zero.
  Metadata is loaded at construction; disable File Source repeat and do not
  seek during playback.

  Annotations whose core:label starts with "wifi-frame-" also emit a frame_start
  tag at core:sample_start. If core:sample_count is present, a frame_end tag is
  emitted at core:sample_start + core:sample_count - 1 (the last frame sample).
  Counts must be positive integers and end offsets must fit uint64. Missing
  counts retain start-only tagging. Both PMT dictionaries contain frame_id
  (label as a symbol), sample_start (original frame start, uint64), sample_offset
  (original event offset, uint64), and timestamp_ns (CLOCK_MONOTONIC nanoseconds,
  uint64). Frame labels must be unique in the file. Events before Starting Sample
  Offset are skipped independently; a seek into a frame still emits its end.
  Other annotations are ignored. One timestamp is taken at work() entry before
  sample copying or tag processing and reused for all events in that callback.
  This measures buffer ingress, not per-sample arrival. Use
  time.clock_gettime_ns(time.CLOCK_MONOTONIC) downstream. Scheduler batching
  affects measured latency. SigMF recording timestamps are not used.

file_format: 1
