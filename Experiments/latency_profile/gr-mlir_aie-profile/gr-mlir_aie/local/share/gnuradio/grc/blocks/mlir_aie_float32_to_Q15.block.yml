id: mlir_aie_float32_to_Q15
label: float32_to_Q15
category: '[mlir_aie]'

templates:
  imports: from gnuradio import mlir_aie
  make: mlir_aie.float32_to_Q15(${safe})

documentation: |-
  Converts float samples to signed Q0.15 samples. Unsafe mode assumes all
  inputs are in range and truncates toward zero. Safe mode rounds and
  saturates.

parameters:
- id: safe
  label: Safe conversion
  dtype: bool
  default: 'False'

inputs:
-   label: in
    domain: stream
    dtype: float

outputs:
-   label: out
    domain: stream
    dtype: short

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
